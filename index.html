    <script>
      (function() {
        // 1. Mock Vite HMR WebSocket so @vite/client never triggers "WebSocket closed without opened"
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isHmr = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isHmr) {
              var fakeSocket = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                url: url,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                close: function() {},
                send: function() {},
                addEventListener: function(event, handler) {
                  if (event === 'open') {
                    setTimeout(function() {
                      try { handler({ type: 'open' }); } catch (err) {}
                    }, 10);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
              setTimeout(function() {
                if (typeof fakeSocket.onopen === 'function') {
                  try { fakeSocket.onopen({ type: 'open' }); } catch (err) {}
                }
              }, 10);
              return fakeSocket;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Filter out console.error calls regarding WebSocket / Vite client
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { return String((a && a.message) || a); }).join(' ');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        // 3. Catch uncaught window errors for WebSocket
        window.addEventListener('error', function(e) {
          var text = (e && (e.message || (e.error && e.error.message))) || '';
          if (text.indexOf('WebSocket') !== -1 || text.indexOf('@vite/client') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var text = String((e && e.reason) || '');
          if (text.indexOf('WebSocket') !== -1 || text.indexOf('@vite/client') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
